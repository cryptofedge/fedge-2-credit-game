<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#06060F" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FEDGE 2.O" />
    <title>FEDGE 2.O</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      /* Deep space background visible on desktop */
      html {
        width: 100%;
        height: 100%;
        background-color: #02020A;
        background-image:
          radial-gradient(ellipse at 20% 20%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
          radial-gradient(ellipse at 80% 80%, rgba(16, 185, 129, 0.06) 0%, transparent 50%);
      }

      body {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      /* Mobile shell — max phone width, full height, centered */
      #root {
        position: relative;
        width: 100%;
        max-width: 430px;
        height: 100dvh;           /* dynamic viewport height for mobile */
        height: 100vh;            /* fallback */
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background-color: #06060F;

        /* Subtle phone shadow on desktop */
        box-shadow:
          0 0 0 1px rgba(99, 102, 241, 0.15),
          0 32px 80px rgba(0, 0, 0, 0.8),
          0 0 60px rgba(99, 102, 241, 0.06);
      }

      /* On actual mobile screens: no shadow, full width */
      @media (max-width: 480px) {
        body { background-color: #06060F; }
        #root {
          max-width: 100%;
          box-shadow: none;
        }
      }

      /* Desktop hint text below the phone */
      body::after {
        content: 'FEDGE 2.O  ·  Powered by Eclat Universe';
        position: fixed;
        bottom: 16px;
        left: 0;
        right: 0;
        text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 11px;
        letter-spacing: 2px;
        color: rgba(255,255,255,0.18);
        pointer-events: none;
      }

      @media (max-width: 480px) {
        body::after { display: none; }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
