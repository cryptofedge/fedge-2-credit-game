function reducer(state,action){
  switch(action.type){
    case'ADD_XP':{
      const newXp=state.xp+action.amount;
      const levelUp=newXp>=state.xpMax;
      return{...state,xp:levelUp?newXp-state.xpMax:newXp,level:levelUp?state.level+1:state.level,xpMax:levelUp?Math.round(state.xpMax*1.4):state.xpMax,pendingLevelUp:levelUp?state.level+1:null};
    }
    case'ADD_COINS':return{...state,coins:Math.max(0,state.coins+action.amount)};
    case'CHANGE_SCORE':return{...state,creditScore:Math.max(300,Math.min(850,state.creditScore+action.amount)),scoreChanged:action.amount};
    case'TICK_ACTION':{
      const ac=state.actionCount+1;
      const evt=ac%3===0?RANDOM_EVENTS[Math.floor(Math.random()*RANDOM_EVENTS.length)]:null;
      return{...state,actionCount:ac,day:state.day+(ac%5===0?1:0),pendingEvent:evt};
    }
    case'CLEAR_EVENT':return{...state,pendingEvent:null};
    case'CLEAR_LEVEL_UP':return{...state,pendingLevelUp:null};
    case'ADD_FEED':return{...state,socialFeed:[{id:Date.now(),...action.post},...state.socialFeed].slice(0,50)};
    case'COMPLETE_MISSION':return{...state,completedMissions:[...state.completedMissions,action.id]};
    case'COMPLETE_SCENARIO':return{...state,completedScenarios:[...state.completedScenarios,action.id]};
    case'UNLOCK_VAULT':return{...state,unlockedVault:[...state.unlockedVault,action.id]};
    case'NPC_TALKED':return{...state,npcTalked:[...state.npcTalked,action.id]};
    case'SET_PLAYER':return{...state,playerName:action.name,avatar:action.avatar,playerPhoto:action.photo||null};
    case'BATTLE_WIN':return{...state,xp:state.xp+action.xp,coins:state.coins+action.coins,creditScore:Math.min(850,state.creditScore+action.scoreChange)};
    default:return state;
  }
}

const S={
  screen:{display:'flex',flexDirection:'column',height:'100%',overflowY:'auto',overflowX:'hidden',background:C.bg},
  btn:(bg=`linear-gradient(135deg,${C.primary},#FF9A4A)`)=>({background:bg,border:'none',borderRadius:16,padding:'17px 28px',color:'#fff',fontSize:15,fontWeight:800,cursor:'pointer',width:'100%',letterSpacing:0.3}),
  card:{background:C.card,borderRadius:20,padding:20,border:`1px solid ${C.border}`},
  tag:(color)=>({background:`${color}22`,border:`1px solid ${color}44`,borderRadius:20,padding:'6px 14px',fontSize:13,color,fontWeight:700}),
};

function ScoreRing({score,size=200,pulse=false}){
  const r=size*0.38,cx=size/2,cy=size*0.55;
  const circ=Math.PI*r,pct=(score-300)/550;
  const color=scoreColor(score);
  const filled=circ*Math.min(pct,1);
  return(
    <div style={{position:'relative',width:size,height:size*0.65,display:'flex',justifyContent:'center'}}>
      <svg width={size} height={size*0.65} style={{overflow:'visible'}} className={pulse?'score-pulse':''}>
        <path d={`M${cx-r} ${cy} A${r} ${r} 0 0 1 ${cx+r} ${cy}`} fill="none" stroke={C.border} strokeWidth={size*0.065} strokeLinecap="round"/>
        <path d={`M${cx-r} ${cy} A${r} ${r} 0 0 1 ${cx+r} ${cy}`} fill="none" stroke={color} strokeWidth={size*0.065} strokeLinecap="round" strokeDasharray={`${filled} ${circ}`} style={{filter:`drop-shadow(0 0 6px ${color})`,transition:'stroke-dasharray 0.6s ease'}}/>
        <text x={cx} y={cy-8} textAnchor="middle" fill={C.text} fontSize={size*0.21} fontWeight="900" fontFamily="-apple-system,sans-serif">{score}</text>
        <text x={cx} y={cy+14} textAnchor="middle" fill={color} fontSize={size*0.08} fontWeight="700" fontFamily="-apple-system,sans-serif">{scoreLabel(score).toUpperCase()}</text>
      </svg>
    </div>
  );
}

function StatBar({gs}){
  return(
    <div style={{position:'absolute',top:0,left:0,right:0,zIndex:100,background:`${C.card}F0`,borderBottom:`1px solid ${C.border}`,backdropFilter:'blur(8px)',display:'flex',gap:0}}>
      {[['📊',gs.creditScore,scoreColor(gs.creditScore)],[`Lv${gs.level}`,gs.xp+' XP',C.primary],['🪙',gs.coins,C.gold],['🔥',gs.streak+'d',C.primary]].map(([label,val,col],i)=>(
        <div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',padding:'8px 4px',borderRight:i<3?`1px solid ${C.border}`:'none'}}>
          <div style={{fontSize:10,color:C.sub,fontWeight:600}}>{label}</div>
          <div style={{fontSize:12,fontWeight:900,color:col,marginTop:1}}>{val}</div>
        </div>
      ))}
    </div>
  );
}

function EventModal({event,dispatch,gs}){
  const[chosen,setChosen]=useState(null);
  function pick(choice){
    if(chosen)return;
    setChosen(choice);
    if(choice.outcome.scoreChange)dispatch({type:'CHANGE_SCORE',amount:choice.outcome.scoreChange});
    if(choice.outcome.coins)dispatch({type:'ADD_COINS',amount:choice.outcome.coins});
    if(choice.outcome.xp)dispatch({type:'ADD_XP',amount:choice.outcome.xp});
    dispatch({type:'ADD_FEED',post:{avatar:gs.avatar,photo:gs.playerPhoto,name:gs.playerName,text:`${event.title} — chose: "${choice.text}"`,day:gs.day,likes:Math.floor(Math.random()*860)+40,comments:Math.floor(Math.random()*30)+1}});
    dispatch({type:'TICK_ACTION'});
  }
  return(
    <div style={{position:'absolute',inset:0,zIndex:200,background:'rgba(6,6,15,0.92)',display:'flex',flexDirection:'column',justifyContent:'flex-end',backdropFilter:'blur(4px)'}}>
      <div style={{background:C.card,borderRadius:'28px 28px 0 0',border:`1px solid ${C.border}`,padding:'28px 22px 40px',animation:'slideUp 0.35s ease'}}>
        <div style={{width:40,height:4,background:C.border,borderRadius:2,margin:'0 auto 20px'}}/>
        <div style={{fontSize:48,textAlign:'center',marginBottom:12}}>{event.icon}</div>
        <div style={{fontSize:18,fontWeight:900,color:C.text,textAlign:'center',marginBottom:8}}>{event.title}</div>
        <div style={{fontSize:14,color:C.sub,lineHeight:1.65,textAlign:'center',marginBottom:22}}>{event.body}</div>
        {chosen?(
          <>
            <div style={{...S.card,background:chosen.outcome.scoreChange>0?`${C.green}18`:`${C.red}18`,border:`1px solid ${chosen.outcome.scoreChange>0?C.green:C.red}`,textAlign:'center',marginBottom:16}}>
              <div style={{fontSize:22,fontWeight:900,color:chosen.outcome.scoreChange>0?C.green:chosen.outcome.scoreChange<0?C.red:C.gold}}>
                {chosen.outcome.scoreChange>0?'+':''}{chosen.outcome.scoreChange||0} pts
                {chosen.outcome.coins?' · +'+chosen.outcome.coins+' 🪙':''}
                {chosen.outcome.xp?' · +'+chosen.outcome.xp+' XP':''}
              </div>
              <div style={{fontSize:13,color:C.sub,marginTop:8,lineHeight:1.6}}>{chosen.outcome.desc}</div>
            </div>
            <button style={S.btn()} onClick={()=>dispatch({type:'CLEAR_EVENT'})}>Got It ✓</button>
          </>
        ):(
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            {event.choices.map((c,i)=>(
              <button key={i} onClick={()=>pick(c)} style={{...S.card,border:`2px solid ${C.border}`,textAlign:'left',color:C.text,fontSize:14,fontWeight:600,cursor:'pointer',padding:'16px 18px'}}>
                {c.text}
              </button>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function LevelUpModal({level,dispatch}){
  return(
    <div style={{position:'absolute',inset:0,zIndex:300,background:'rgba(6,6,15,0.95)',display:'flex',flexDirection:'column',justifyContent:'center',alignItems:'center',gap:20}}>
      <div style={{fontSize:100,animation:'pulse 0.6s infinite'}}>🔥</div>
      <div style={{fontSize:40,fontWeight:900,color:C.primary,textAlign:'center'}}>LEVEL UP!</div>
      <div style={{fontSize:28,fontWeight:900,color:C.text}}>Level {level}</div>
      <div style={{fontSize:15,color:C.sub}}>{850-level*20} points away from FEDGE Elite</div>
      <button style={{...S.btn(),maxWidth:260}} onClick={()=>dispatch({type:'CLEAR_LEVEL_UP'})}>Keep Going 🚀</button>
    </div>
  );
}

function Splash({go}){
  useEffect(()=>{const t=setTimeout(()=>go('hero'),2800);return()=>clearTimeout(t)},[]);
  return(
    <div style={{...S.screen,justifyContent:'center',alignItems:'center',gap:24,background:`radial-gradient(ellipse at center, #1a0f06 0%, ${C.bg} 70%)`}}>
      <div style={{position:'relative',display:'flex',justifyContent:'center',alignItems:'center'}}>
        <div style={{position:'absolute',width:160,height:160,borderRadius:'50%',background:`radial-gradient(circle, ${C.primary}33 0%, transparent 70%)`,animation:'glow 2s infinite'}}/>
        <img src={FEDGE_LOGO} alt="FEDGE" style={{width:140,height:140,objectFit:'contain',animation:'pulse 2s infinite',filter:'drop-shadow(0 0 24px rgba(232,112,18,0.7))'}}/>
      </div>
      <div style={{textAlign:'center'}}>
        <div style={{fontSize:40,fontWeight:900,color:C.primary,letterSpacing:3}}>FEDGE 2.O</div>
        <div style={{fontSize:13,color:C.sub,letterSpacing:5,marginTop:6}}>CREDIT EDUCATION</div>
      </div>
      <div style={{display:'flex',gap:10,marginTop:8}}>
        {[0,1,2].map(i=><div key={i} style={{width:8,height:8,borderRadius:4,background:i===0?C.primary:C.muted,animation:`pulse 1s ${i*0.3}s infinite`}}/>)}
      </div>
    </div>
  );
}

function Hero({go}){
  return(
    <div style={{...S.screen,padding:'40px 28px 36px',justifyContent:'space-between',animation:'fadeUp 0.5s ease'}}>
      <div>
        <div style={{fontSize:13,color:C.primary,fontWeight:700,letterSpacing:3,marginBottom:20}}>POWERED BY FEDGE 2.O</div>
        <div style={{fontSize:38,fontWeight:900,color:C.text,lineHeight:1.1,marginBottom:18}}>
          Master Your<br/><span style={{color:C.primary}}>Credit Score</span><br/>Like a Pro
        </div>
        <div style={{fontSize:15,color:C.sub,lineHeight:1.7,marginBottom:36}}>
          Build, fix, and maintain an 800+ credit score through real-life missions, scenarios, and expert lessons.
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:12,marginBottom:36}}>
          {[['🎯','Missions'],['📊','Simulator'],['🎮','Scenarios']].map(([icon,label])=>(
            <div key={label} style={{...S.card,textAlign:'center',padding:'18px 8px'}}>
              <div style={{fontSize:28,marginBottom:8}}>{icon}</div>
              <div style={{fontSize:12,color:C.sub,fontWeight:600}}>{label}</div>
            </div>
          ))}
        </div>
      </div>
      <button style={S.btn()} onClick={()=>go('ghost')}>Start Your Journey ⚡</button>
    </div>
  );
}

function Ghost({go}){
  return(

function BattleRunner({gs,dispatch,onClose}){
  const canvasRef=useRef(null);
  const W=350,H=260,GROUND=205,PX=65,PR=20;
  const gameRef=useRef({playerY:GROUND,playerVY:0,jumping:false,obstacles:[],powerups:[],frame:0,xpEarned:0,coinsEarned:0,hp:3,alive:true,done:false,elapsed:0,speed:2.8});

  useEffect(()=>{
    const canvas=canvasRef.current;
    const ctx=canvas.getContext('2d');
    const g=gameRef.current;
    let animId,last=performance.now();

    function jump(){if(!g.jumping&&g.alive&&!g.done){g.playerVY=-10;g.jumping=true;}}
    canvas.addEventListener('click',jump);
    canvas.addEventListener('touchstart',e=>{e.preventDefault();jump();},{passive:false});

    function update(dt){
      if(!g.alive||g.done)return;
      g.elapsed+=dt;g.frame++;
      g.speed=2.8+g.elapsed*0.05;
      g.playerVY+=0.55;g.playerY+=g.playerVY;
      if(g.playerY>=GROUND){g.playerY=GROUND;g.playerVY=0;g.jumping=false;}

      const spawnRate=Math.max(38,75-g.elapsed*1.5);
      if(g.frame%Math.round(spawnRate)===0){
        const isGround=Math.random()>0.45;
        g.obstacles.push({x:W+30,y:isGround?GROUND-4:GROUND-58,type:isGround?'g':'a',emoji:isGround?'❌':'📬'});
      }
      if(g.frame%55===20)g.powerups.push({x:W+20,y:GROUND-55,type:Math.random()>0.5?'coin':'xp',emoji:Math.random()>0.5?'🪙':'⚡'});

      g.obstacles=g.obstacles.filter(o=>{o.x-=g.speed;return o.x>-40;});
      g.powerups=g.powerups.filter(p=>{p.x-=g.speed;return p.x>-20;});

      g.obstacles.forEach((o,i)=>{
        if(Math.abs(PX-o.x)<28&&Math.abs(g.playerY-o.y)<28){
          g.hp--;g.obstacles.splice(i,1);
          if(g.hp<=0)g.alive=false;
        }
      });
      g.powerups.forEach((p,i)=>{
        if(Math.abs(PX-p.x)<PR+10&&Math.abs(g.playerY-p.y)<PR+14){
          if(p.type==='coin')g.coinsEarned+=15;else g.xpEarned+=30;
          g.powerups.splice(i,1);
        }
      });
      g.xpEarned+=Math.round(dt*8);
      if(g.elapsed>=30)g.done=true;
    }

    function draw(){
      ctx.clearRect(0,0,W,H);
      ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
      // Scrolling grid lines
      ctx.strokeStyle='#1a1a30';ctx.lineWidth=1;
      for(let i=0;i<6;i++){const x=((g.frame*g.speed*0.5)%80)+i*80-80;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
      // Ground
      ctx.strokeStyle=C.primary;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(0,GROUND+PR);ctx.lineTo(W,GROUND+PR);ctx.stroke();
      // Ground track dashes
      ctx.fillStyle='#1E1E3A';
      for(let i=0;i<8;i++){const x=((g.frame*g.speed)%70)+i*70-70;ctx.fillRect(x,GROUND+PR+5,40,4);}
      // THE ALGORITHM boss (top right, floats)
      const bossY=28+Math.sin(g.frame*0.04)*6;
      ctx.font='36px serif';ctx.textAlign='center';ctx.fillText('🤖',W-40,bossY);
      ctx.fillStyle=C.purple;ctx.font='bold 9px sans-serif';ctx.textAlign='center';
      ctx.fillText('THE ALGORITHM',W-40,bossY+22);
      // Player glow
      ctx.save();ctx.shadowColor=C.primary;ctx.shadowBlur=16;
      ctx.fillStyle=C.primary;ctx.beginPath();ctx.arc(PX,g.playerY,PR,0,Math.PI*2);ctx.fill();
      ctx.restore();
      if(gs.playerPhoto){
        try{
          ctx.save();ctx.beginPath();ctx.arc(PX,g.playerY,PR,0,Math.PI*2);ctx.clip();
          const img=new Image();img.src=gs.playerPhoto;ctx.drawImage(img,PX-PR,g.playerY-PR,PR*2,PR*2);
          ctx.restore();
        }catch(e){ctx.font='18px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(gs.avatar,PX,g.playerY);}
      }else{ctx.font='18px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(gs.avatar,PX,g.playerY);}
      // Obstacles
      g.obstacles.forEach(o=>{ctx.font='26px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(o.emoji,o.x,o.y);});
      // Powerups bounce
      g.powerups.forEach(p=>{const bounce=Math.sin(g.frame*0.12)*4;ctx.font='22px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.emoji,p.x,p.y+bounce);});
      // HP hearts
      for(let i=0;i<3;i++){ctx.font='16px serif';ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText(i<g.hp?'❤️':'🖤',10+i*22,10);}
      // XP counter
      ctx.fillStyle=C.gold;ctx.font='bold 13px sans-serif';ctx.textAlign='right';ctx.textBaseline='top';
      ctx.fillText(`+${g.xpEarned} XP`,W-8,10);
      // Timer bar
      const tl=Math.max(0,30-g.elapsed);
      ctx.fillStyle='#1E1E3A';ctx.fillRect(10,H-14,W-20,6);
      ctx.fillStyle=tl<6?C.red:'#00C853';ctx.fillRect(10,H-14,(W-20)*(tl/30),6);
      ctx.fillStyle=C.sub;ctx.font='10px sans-serif';ctx.textAlign='left';ctx.fillText(`${Math.ceil(tl)}s`,10,H-22);
      // Speed indicator
      ctx.fillStyle=C.primary;ctx.textAlign='right';ctx.fillText(`Speed x${g.speed.toFixed(1)}`,W-8,H-22);
      // Game over overlay
      if(!g.alive||g.done){
        ctx.fillStyle='rgba(6,6,15,0.8)';ctx.fillRect(0,0,W,H);
        ctx.fillStyle=g.alive?C.green:C.red;ctx.font='bold 28px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(g.alive?'🏆 VICTORY!':'💀 GAME OVER',W/2,H/2-26);
        ctx.fillStyle=C.gold;ctx.font='bold 17px sans-serif';
        ctx.fillText(`+${g.xpEarned} XP  +${g.coinsEarned} 🪙`,W/2,H/2+10);
        ctx.fillStyle=C.sub;ctx.font='13px sans-serif';
        ctx.fillText('Tap to close',W/2,H/2+36);
      }
    }

    function loop(now){
      const dt=Math.min((now-last)/1000,0.05);last=now;
      update(dt);draw();
      if(g.alive&&!g.done){animId=requestAnimationFrame(loop);}
      else{
        draw();
        setTimeout(()=>{
          dispatch({type:'BATTLE_WIN',xp:g.xpEarned,coins:g.coinsEarned,scoreChange:g.alive?Math.floor(g.xpEarned/30):0});
          dispatch({type:'ADD_FEED',post:{avatar:gs.avatar,name:gs.playerName,text:`Survived THE ALGORITHM's credit attacks! +${g.xpEarned} XP earned. ⚔️`,day:gs.day,likes:Math.floor(Math.random()*600)+80,comments:Math.floor(Math.random()*20)+2}});
        },2200);
      }
    }
    animId=requestAnimationFrame(loop);
    return()=>{cancelAnimationFrame(animId);canvas.removeEventListener('click',jump);};
  },[]);

  return(
    <div style={{...S.screen,padding:'20px 18px 30px',animation:'fadeUp 0.3s ease'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
        <div>
          <div style={{fontSize:20,fontWeight:900,color:C.text}}>⚔️ Credit Defender</div>
          <div style={{fontSize:12,color:C.sub}}>Dodge THE ALGORITHM's attacks</div>
        </div>
        <button onClick={onClose} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:'7px 14px',color:C.sub,cursor:'pointer',fontSize:14}}>✕</button>
      </div>
      <div style={{...S.card,marginBottom:12,padding:'10px 14px',background:`${C.purple}12`,border:`1px solid ${C.purple}33`}}>
        <div style={{display:'flex',gap:16,fontSize:12,color:C.sub}}>
          <span>❌ = Late payment → jump over</span>
          <span>📬 = Inquiry → duck under</span>
        </div>
        <div style={{fontSize:12,color:C.sub,marginTop:4}}>⚡🪙 = Collect bonuses • <span style={{color:C.primary,fontWeight:700}}>TAP to jump</span></div>
      </div>
      <canvas ref={canvasRef} width={350} height={260} style={{borderRadius:18,border:`1px solid ${C.border}`,display:'block',width:'100%',cursor:'pointer'}}/>
    </div>
  );
}

function Reveal({go}){
  const[score,setScore]=useState(300);
  const target=720;
  useEffect(()=>{
    const iv=setInterval(()=>setScore(s=>{if(s>=target){clearInterval(iv);return target}return Math.min(s+7,target)}),14);
    return()=>clearInterval(iv);
  },[]);
  return(
    <div style={{...S.screen,justifyContent:'center',alignItems:'center',padding:28,animation:'fadeUp 0.4s ease'}}>
      <div style={{textAlign:'center'}}>
        <div style={{fontSize:13,color:C.sub,letterSpacing:3,marginBottom:28}}>YOUR DEMO SCORE</div>
        <div style={{display:'flex',justifyContent:'center',marginBottom:20}}><ScoreRing score={score} size={230} pulse={score===target}/></div>
        <div style={{fontSize:15,color:C.sub,marginBottom:36,lineHeight:1.7}}>
          You're <span style={{color:C.gold,fontWeight:700}}>Good</span> — let's get you to{' '}
          <span style={{color:C.green,fontWeight:700}}>Exceptional (800+)</span>
        </div>
        <button style={{...S.btn(),opacity:score>=target?1:0.3}} disabled={score<target} onClick={()=>go('home')}>Let's Build It! 🚀</button>
      </div>
    </div>
  );
}

function NPCRow({gs,dispatch}){
  const[activeNpc,setActiveNpc]=useState(null);
  const[activeDialogue,setActiveDialogue]=useState(null);

  function talk(npc,dialogue){
    setActiveDialogue(dialogue);
    dispatch({type:'ADD_XP',amount:dialogue.reward.xp});
    if(dialogue.reward.scoreChange)dispatch({type:'CHANGE_SCORE',amount:dialogue.reward.scoreChange});
    if(dialogue.reward.coins)dispatch({type:'ADD_COINS',amount:dialogue.reward.coins});
    dispatch({type:'NPC_TALKED',id:`${npc.id}_${dialogue.q}`});
    dispatch({type:'ADD_FEED',post:{avatar:gs.avatar,photo:gs.playerPhoto,name:gs.playerName,text:`Got schooled by ${npc.name} — "${dialogue.answer.slice(0,60)}..."`,day:gs.day,likes:Math.floor(Math.random()*500)+40,comments:Math.floor(Math.random()*20)+1}});
    dispatch({type:'TICK_ACTION'});
  }

  if(activeNpc&&activeDialogue){
    return(
      <div style={{...S.card,marginBottom:14,animation:'slideUp 0.3s ease'}}>
        <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16}}>
          <div style={{fontSize:40}}>{activeNpc.icon}</div>
          <div>
            <div style={{fontSize:15,fontWeight:900,color:C.text}}>{activeNpc.name}</div>
            <div style={{fontSize:11,color:C.sub}}>{activeNpc.role}</div>
          </div>
          <button onClick={()=>{setActiveNpc(null);setActiveDialogue(null);}} style={{marginLeft:'auto',background:C.card2,border:`1px solid ${C.border}`,borderRadius:10,padding:'6px 12px',color:C.sub,cursor:'pointer',fontSize:12}}>✕</button>
        </div>
        <div style={{fontSize:13,color:C.text,lineHeight:1.7,marginBottom:14,background:C.card2,borderRadius:12,padding:14}}>{activeDialogue.answer}</div>
        <div style={{display:'flex',gap:10}}>
          {activeDialogue.reward.xp>0&&<span style={S.tag(C.primary)}>+{activeDialogue.reward.xp} XP</span>}
          {activeDialogue.reward.scoreChange!==0&&<span style={S.tag(activeDialogue.reward.scoreChange>0?C.green:C.red)}>{activeDialogue.reward.scoreChange>0?'+':''}{activeDialogue.reward.scoreChange} pts</span>}
          {activeDialogue.reward.coins>0&&<span style={S.tag(C.gold)}>+{activeDialogue.reward.coins} 🪙</span>}
        </div>
      </div>
    );
  }

  if(activeNpc){
    return(
      <div style={{...S.card,marginBottom:14,animation:'slideUp 0.3s ease'}}>
        <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16}}>
          <div style={{fontSize:40}}>{activeNpc.icon}</div>
          <div style={{flex:1}}>
            <div style={{fontSize:15,fontWeight:900,color:C.text}}>{activeNpc.name}</div>
            <div style={{fontSize:11,color:activeNpc.statusColor,fontWeight:700}}>● {activeNpc.status}</div>
          </div>
          <button onClick={()=>setActiveNpc(null)} style={{background:C.card2,border:`1px solid ${C.border}`,borderRadius:10,padding:'6px 12px',color:C.sub,cursor:'pointer',fontSize:12}}>✕</button>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:8}}>
          {activeNpc.dialogues.map((d,i)=>(
            <button key={i} onClick={()=>talk(activeNpc,d)} style={{...S.card,background:C.card2,border:`1px solid ${C.border}`,textAlign:'left',color:C.text,fontSize:13,fontWeight:600,cursor:'pointer',padding:'14px 16px'}}>
              "{d.q}"
            </button>
          ))}
        </div>
      </div>
    );
  }

  return(
    <div style={{marginBottom:14}}>
      <div style={{fontSize:12,color:C.sub,fontWeight:700,letterSpacing:2,marginBottom:10}}>EXPERTS</div>
      <div style={{display:'flex',gap:10,overflowX:'auto',paddingBottom:6}}>
        {NPCS.map(npc=>(
          <button key={npc.id} onClick={()=>setActiveNpc(npc)} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:16,padding:'12px 14px',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:6,minWidth:80,flexShrink:0}}>
            <div style={{fontSize:32}}>{npc.icon}</div>
            <div style={{fontSize:10,color:C.text,fontWeight:700,textAlign:'center',lineHeight:1.2}}>{npc.name.split(' ')[0]}</div>
            <div style={{width:6,height:6,borderRadius:3,background:npc.statusColor}}/>
          </button>
        ))}
      </div>
    </div>
  );
}

function MissionPlayer({mission,gs,dispatch,onDone}){
  const[phase,setPhase]=useState('lesson');
  const[slide,setSlide]=useState(0);
  const[qIdx,setQIdx]=useState(0);
  const[sel,setSel]=useState(null);
  const[correct,setCorrect]=useState(0);
  const sl=mission.slides[slide];
  const q=mission.quiz[qIdx];

  function pickAnswer(i){
    if(sel!==null)return;
    setSel(i);
    if(i===q.ans)setCorrect(c=>c+1);
    setTimeout(()=>{
      setSel(null);
      if(qIdx===mission.quiz.length-1)setPhase('results');
      else setQIdx(x=>x+1);
    },1400);
  }

  function finish(xp){
    dispatch({type:'ADD_XP',amount:xp});
    dispatch({type:'ADD_COINS',amount:Math.floor(xp/3)});
    dispatch({type:'COMPLETE_MISSION',id:mission.id});
    dispatch({type:'ADD_FEED',post:{avatar:gs.avatar,photo:gs.playerPhoto,name:gs.playerName,text:`Just leveled up on "${mission.title}"! 📊`,day:gs.day,likes:Math.floor(Math.random()*600)+40,comments:Math.floor(Math.random()*25)+1}});
    dispatch({type:'TICK_ACTION'});
  }

  if(phase==='results'){
    const pct=Math.round(correct/mission.quiz.length*100);
    const xp=Math.round(mission.xp*(correct/mission.quiz.length));
    return(
      <div style={{...S.screen,justifyContent:'center',alignItems:'center',padding:28,textAlign:'center',animation:'fadeUp 0.4s ease'}}>
        <div style={{fontSize:80,marginBottom:20}}>🎉</div>
        <div style={{fontSize:28,fontWeight:900,color:C.text,marginBottom:8}}>Mission Complete!</div>
        <div style={{fontSize:52,fontWeight:900,color:C.gold,margin:'16px 0'}}>{pct}%</div>
        <div style={{fontSize:15,color:C.sub,marginBottom:24}}>{correct}/{mission.quiz.length} correct</div>
        <div style={{...S.card,background:`${C.primary}18`,border:`1px solid ${C.primary}44`,marginBottom:28}}>
          <div style={{fontSize:34,fontWeight:900,color:C.primary}}>+{xp} XP ⚡</div>
          <div style={{fontSize:13,color:C.sub,marginTop:6}}>+{Math.floor(xp/3)} 🪙 FEDGE Coins</div>
        </div>
        <button style={S.btn()} onClick={()=>{finish(xp);onDone();}}>Back to Missions</button>
      </div>
    );
  }

  if(phase==='quiz'){
    return(
      <div style={{...S.screen,padding:'24px 18px',animation:'fadeUp 0.3s ease'}}>
        <div style={{fontSize:12,color:C.sub,letterSpacing:2,marginBottom:12}}>QUESTION {qIdx+1} OF {mission.quiz.length}</div>
        <div style={{height:4,background:C.border,borderRadius:2,marginBottom:28}}>
          <div style={{height:'100%',width:`${(qIdx/mission.quiz.length)*100}%`,background:mission.color,borderRadius:2,transition:'width 0.3s'}}/>
        </div>
        <div style={{fontSize:21,fontWeight:800,color:C.text,lineHeight:1.35,marginBottom:28}}>{q.q}</div>
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          {q.opts.map((opt,i)=>{
            let bg=C.card,border=C.border,col=C.text;
            if(sel!==null){
              if(i===q.ans){bg=`${C.green}22`;border=C.green;col=C.green;}
              else if(i===sel){bg=`${C.red}22`;border=C.red;col=C.red;}
            }
            return(
              <button key={i} onClick={()=>pickAnswer(i)} style={{background:bg,border:`2px solid ${border}`,borderRadius:16,padding:'18px 20px',textAlign:'left',color:col,fontSize:15,fontWeight:600,cursor:'pointer',transition:'all 0.25s'}}>
                {opt}
              </button>
            );
          })}
        </div>
      </div>
    );
  }

  return(
    <div style={{...S.screen,padding:'24px 18px 32px',animation:'fadeUp 0.3s ease'}}>
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16}}>
        <button onClick={onDone} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:'8px 14px',color:C.text,fontSize:16,cursor:'pointer'}}>←</button>
        <div style={{fontSize:15,fontWeight:800,color:C.text,flex:1}}>{mission.title}</div>
        <span style={S.tag(mission.color)}>{slide+1}/{mission.slides.length}</span>
      </div>
      <div style={{height:4,background:C.border,borderRadius:2,marginBottom:28}}>
        <div style={{height:'100%',width:`${((slide+1)/mission.slides.length)*100}%`,background:mission.color,borderRadius:2,transition:'width 0.3s'}}/>
      </div>
      <div style={{...S.card,flex:1,textAlign:'center',padding:28,marginBottom:20,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}>
        <div style={{fontSize:72,marginBottom:20}}>{sl.icon}</div>
        <div style={{fontSize:20,fontWeight:900,color:C.text,marginBottom:16,lineHeight:1.25}}>{sl.title}</div>
        <div style={{fontSize:15,color:C.sub,lineHeight:1.85}}>{sl.body}</div>
      </div>
      <button style={S.btn(slide===mission.slides.length-1?`linear-gradient(135deg,${C.green},#00A843)`:`linear-gradient(135deg,${C.primary},#FF9A4A)`)}
        onClick={()=>{if(slide===mission.slides.length-1)setPhase('quiz');else setSlide(s=>s+1)}}>
        {slide===mission.slides.length-1?'🎯 Take the Quiz!':'Next →'}
      </button>
    </div>
  );
}

function Simulator(){
  const[f,setF]=useState({pay:97,util:12,age:7,mix:3,inq:1});
  function calc(){
    const p=(f.pay/100)*35;const u=(1-f.util/100)*30;
    const a=Math.min(f.age/15,1)*15;const m=(f.mix/5)*10;
    const i=Math.max(0,1-f.inq/6)*10;
    return Math.round(300+(p+u+a+m+i)/100*550);
  }
  const score=calc();
  const sliders=[
    {k:'pay',label:'⏰ Payment History',desc:`${f.pay}% on-time`,min:0,max:100,weight:'35%'},
    {k:'util',label:'💳 Utilization',desc:`${f.util}% used`,min:0,max:100,weight:'30%'},
    {k:'age',label:'📅 Credit Age',desc:`${f.age} years avg`,min:0,max:20,weight:'15%'},
    {k:'mix',label:'🔀 Account Types',desc:`${f.mix} types`,min:0,max:5,weight:'10%'},
    {k:'inq',label:'🆕 Recent Inquiries',desc:`${f.inq} inquiries`,min:0,max:6,weight:'10%'},
  ];
  return(
    <div style={{...S.screen,padding:'68px 18px 100px',animation:'fadeUp 0.3s ease'}}>
      <div style={{fontSize:24,fontWeight:900,color:C.text,marginBottom:4}}>Score Simulator</div>
      <div style={{fontSize:14,color:C.sub,marginBottom:20}}>Drag sliders — watch your score move live</div>
      <div style={{display:'flex',justifyContent:'center',marginBottom:20}}><ScoreRing score={score} size={200}/></div>
      {sliders.map(s=>(
        <div key={s.k} style={{...S.card,marginBottom:14}}>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
            <div style={{fontSize:14,fontWeight:700,color:C.text}}>{s.label}</div>
            <span style={S.tag(C.primary)}>{s.weight}</span>
          </div>
          <div style={{fontSize:12,color:C.sub,marginBottom:12}}>{s.desc}</div>
          <input type="range" min={s.min} max={s.max} value={f[s.k]} onChange={e=>setF(x=>({...x,[s.k]:+e.target.value}))}/>
        </div>
      ))}
    </div>
  );
}

function Scenarios({gs,dispatch}){
  const[idx,setIdx]=useState(0);
  const[chosen,setChosen]=useState(null);
  const sc=SCENARIOS[idx];

  function pick(c){
    if(chosen)return;
    setChosen(c);
    dispatch({type:'CHANGE_SCORE',amount:c.impact});
    dispatch({type:'ADD_XP',amount:80});
    dispatch({type:'ADD_FEED',post:{avatar:gs.avatar,photo:gs.playerPhoto,name:gs.playerName,text:`Made a call on "${sc.title}". Score went ${c.impact>0?'UP':'DOWN'} ${Math.abs(c.impact)} pts.`,day:gs.day,likes:Math.floor(Math.random()*500)+40,comments:Math.floor(Math.random()*20)+1}});
    dispatch({type:'TICK_ACTION'});
  }

  function next(){
    if(idx<SCENARIOS.length-1){setIdx(i=>i+1);setChosen(null);}

  return(

      </div>
      <div style={{...S.card,textAlign:'center',marginBottom:16,padding:28}} className={chosen&&!chosen.good?'shake':''}>

        <div style={{fontSize:20,fontWeight:900,color:C.text,marginBottom:10}}>{sc.title}</div>
        <div style={{fontSize:15,color:C.sub,lineHeight:1.7}}>{sc.desc}</div>
      </div>
      {chosen?(
        <>
          <div style={{...S.card,background:chosen.good?`${C.green}18`:`${C.red}18`,border:`1px solid ${chosen.good?C.green:C.red}`,textAlign:'center',marginBottom:14}}>
            <div style={{fontSize:32,fontWeight:900,color:chosen.good?C.green:C.red,marginBottom:4}}>
              {chosen.impact>0?'+':''}{chosen.impact} pts
            </div>
            <div style={{fontSize:14,color:C.sub,marginBottom:4}}>{chosen.good?'✅ Smart move!':'⚠️ That hurt!'}</div>
            <div style={{fontSize:13,color:C.sub,lineHeight:1.6}}>{chosen.explain}</div>
          </div>
          {idx<SCENARIOS.length-1&&<button style={S.btn()} onClick={next}>Next Scenario →</button>}
          {idx===SCENARIOS.length-1&&(
            <div style={{textAlign:'center',marginTop:16}}>
              <div style={{fontSize:52,marginBottom:12}}>🏆</div>
              <div style={{fontSize:20,fontWeight:900,color:C.text}}>All Scenarios Done!</div>
              <div style={{fontSize:15,color:C.sub,marginTop:8}}>Final: <span style={{color:scoreColor(gs.creditScore),fontWeight:800}}>{gs.creditScore}</span></div>
            </div>
          )}
        </>
      ):(
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          {sc.choices.map((c,i)=>(
            <button key={i} onClick={()=>pick(c)} className="card-hover" style={{...S.card,border:`2px solid ${C.border}`,textAlign:'left',color:C.text,fontSize:14,fontWeight:600,cursor:'pointer',padding:'20px 18px'}}>

          ))}

  );

    <div style={{position:'absolute',bottom:0,left:0,right:0,background:C.card,borderTop:`1px solid ${C.border}`,display:'flex',paddingBottom:12,paddingTop:6}}>
      {tabs.map(([icon,label,route])=>(
        <button key={route} onClick={()=>go(route)} style={{flex:1,background:'none',border:'none',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:2,padding:'3px 0'}}>
          <div style={{fontSize:20,filter:active===route?'none':'grayscale(100%) opacity(0.35)',transition:'filter 0.2s'}}>{icon}</div>
          <div style={{fontSize:9,fontWeight:700,color:active===route?C.primary:C.muted}}>{label}</div>
          {active===route&&<div style={{width:4,height:4,borderRadius:2,background:C.primary}}/>}
        </button>
      ))}
    </div>
  );
}

const MAIN=['home','missions','simulator','scenarios','feed','vault'];

const CHAT_SYS=`You are FEDGE Assistant, an expert credit advisor powered by FEDGE 2.O. You help users understand credit scores, fix credit issues, and navigate the FEDGE 2.O credit education game.

Give practical, actionable advice about:
- FICO score factors: payment history (35%), utilization (30%), length of history (15%), credit mix (10%), new credit (10%)
- How to dispute errors on credit reports (Equifax, Experian, TransUnion)
- Credit building strategies (secured cards, credit-builder loans, authorized user status)
- Debt payoff methods (avalanche vs snowball)
- How to succeed in FEDGE 2.O game missions — earn FEDGE Coins, raise your credit score, beat THE ALGORITHM boss
- Real-life credit repair timelines and what actually works

Keep responses concise, warm, and empowering. You believe everyone can fix their credit with the right knowledge.`;

function FedgeChat({gs}){
  const[open,setOpen]=useState(false);
  const[apiKey,setApiKey]=useState(()=>localStorage.getItem('fedge_api_key')||'');
  const[keyInput,setKeyInput]=useState('');
  const[msgs,setMsgs]=useState([{role:'assistant',content:"Hey! I'm FEDGE Assistant. Ask me anything about credit repair or how to win in the game!"}]);
  const[input,setInput]=useState('');
  const[loading,setLoading]=useState(false);
  const bottomRef=useRef(null);

  useEffect(()=>{if(bottomRef.current)bottomRef.current.scrollIntoView({behavior:'smooth'});},[msgs]);

  async function sendMsg(){
    if(!input.trim()||loading)return;
    const userMsg={role:'user',content:input.trim()};
    const newMsgs=[...msgs,userMsg];
    setMsgs(newMsgs);
    setInput('');
    setLoading(true);
    try{
      const history=newMsgs.slice(1).map(m=>({role:m.role,content:m.content}));
      const res=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{
          'x-api-key':apiKey,
          'anthropic-version':'2023-06-01',
          'anthropic-dangerous-direct-browser-access':'true',
          'content-type':'application/json'
        },
        body:JSON.stringify({
          model:'claude-haiku-4-5',
          max_tokens:512,
          system:CHAT_SYS,
          messages:history
        })
      });
      const data=await res.json();
      if(data.error)throw new Error(data.error.message);
      const reply=data.content[0].text;
      setMsgs(m=>[...m,{role:'assistant',content:reply}]);
    }catch(e){
      setMsgs(m=>[...m,{role:'assistant',content:`Error: ${e.message}. Check your API key.`}]);
    }
    setLoading(false);
  }

  function saveKey(){
    if(!keyInput.trim())return;
    localStorage.setItem('fedge_api_key',keyInput.trim());
    setApiKey(keyInput.trim());
    setKeyInput('');
  }

  const btnStyle={position:'absolute',bottom:90,right:14,width:48,height:48,borderRadius:24,background:`linear-gradient(135deg,${C.primary},${C.gold})`,border:'none',cursor:'pointer',fontSize:22,display:'flex',alignItems:'center',justifyContent:'center',boxShadow:`0 4px 20px rgba(232,112,18,0.5)`,zIndex:200,animation:'pulse 2s ease infinite'};

  const overlayStyle={position:'absolute',inset:0,background:'rgba(6,6,15,0.97)',zIndex:300,display:'flex',flexDirection:'column'};

  return(
    <>
      <button style={btnStyle} onClick={()=>setOpen(true)}>💬</button>
      {open&&(
        <div style={overlayStyle}>
          {/* header */}
          <div style={{background:C.card,borderBottom:`1px solid ${C.border}`,padding:'14px 16px',display:'flex',alignItems:'center',gap:10}}>
            <div style={{fontSize:26}}>🤖</div>
            <div style={{flex:1}}>
              <div style={{color:C.text,fontWeight:800,fontSize:15}}>FEDGE Assistant</div>
              <div style={{color:C.primary,fontSize:10,fontWeight:600}}>Powered by FEDGE 2.O</div>
            </div>
            <button onClick={()=>setOpen(false)} style={{background:C.card2,border:`1px solid ${C.border}`,borderRadius:20,padding:'6px 14px',color:C.sub,fontSize:12,fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',gap:5}}>
              <span style={{fontSize:14}}>←</span> Back
            </button>
          </div>

          {/* api key gate */}
          {!apiKey?(
            <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:24,gap:14}}>
              <div style={{fontSize:40}}>🔑</div>
              <div style={{color:C.text,fontWeight:700,fontSize:16,textAlign:'center'}}>Enter Your Anthropic API Key</div>
              <div style={{color:C.sub,fontSize:12,textAlign:'center',lineHeight:1.5}}>Your key is stored locally and never sent anywhere except directly to Anthropic.</div>
              <input value={keyInput} onChange={e=>setKeyInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&saveKey()} placeholder="sk-ant-..." style={{width:'100%',background:C.card2,border:`1px solid ${C.border}`,borderRadius:10,padding:'10px 14px',color:C.text,fontSize:13,outline:'none'}}/>
              <button onClick={saveKey} style={{width:'100%',background:`linear-gradient(135deg,${C.primary},${C.gold})`,border:'none',borderRadius:10,padding:'12px',color:'#000',fontWeight:800,fontSize:14,cursor:'pointer'}}>Unlock FEDGE Assistant</button>
              <a href="https://console.anthropic.com/settings/keys" target="_blank" style={{color:C.blue,fontSize:11}}>Get a free API key →</a>
            </div>
          ):(
            <>
              {/* messages */}
              <div style={{flex:1,overflowY:'auto',padding:'12px 14px',display:'flex',flexDirection:'column',gap:10}}>
                {msgs.map((m,i)=>(
                  <div key={i} style={{display:'flex',justifyContent:m.role==='user'?'flex-end':'flex-start'}}>
                    <div style={{maxWidth:'82%',background:m.role==='user'?`linear-gradient(135deg,${C.primary},${C.gold})`:`${C.card2}`,borderRadius:m.role==='user'?'16px 16px 4px 16px':'16px 16px 16px 4px',padding:'9px 13px',color:m.role==='user'?'#000':C.text,fontSize:13,lineHeight:1.5,fontWeight:m.role==='user'?700:400}}>
                      {m.content}
                    </div>
                  </div>
                ))}
                {loading&&(
                  <div style={{display:'flex',justifyContent:'flex-start'}}>
                    <div style={{background:C.card2,borderRadius:'16px 16px 16px 4px',padding:'9px 13px',color:C.sub,fontSize:13}}>
                      <span style={{animation:'pulse 1s ease infinite',display:'inline-block'}}>●</span>
                      <span style={{animation:'pulse 1s ease infinite 0.2s',display:'inline-block'}}>●</span>
                      <span style={{animation:'pulse 1s ease infinite 0.4s',display:'inline-block'}}>●</span>
                    </div>
                  </div>
                )}
                <div ref={bottomRef}/>
              </div>
              {/* quick tips */}
              <div style={{padding:'6px 14px',display:'flex',gap:6,overflowX:'auto'}}>
                {['How to raise my score?','Best credit card tip','Dispute a collection','Game tips'].map(q=>(
                  <button key={q} onClick={()=>setInput(q)} style={{whiteSpace:'nowrap',background:C.card2,border:`1px solid ${C.border}`,borderRadius:14,padding:'5px 10px',color:C.sub,fontSize:11,cursor:'pointer',flexShrink:0}}>{q}</button>
                ))}
              </div>
              {/* input */}
              <div style={{padding:'10px 14px 20px',display:'flex',gap:8}}>
                <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&sendMsg()} placeholder="Ask anything about credit..." style={{flex:1,background:C.card2,border:`1px solid ${C.border}`,borderRadius:22,padding:'10px 16px',color:C.text,fontSize:13,outline:'none'}}/>
                <button onClick={sendMsg} disabled={loading||!input.trim()} style={{width:44,height:44,borderRadius:22,background:input.trim()&&!loading?`linear-gradient(135deg,${C.primary},${C.gold})`:'#1E1E3A',border:'none',cursor:input.trim()?'pointer':'default',fontSize:18,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>➤</button>
              </div>
            </>
          )}
        </div>
      )}
    </>
  );
}

function App(){
  const[screen,setScreen]=useState('splash');
  const[mission,setMission]=useState(null);
  const[gs,dispatch]=useReducer(reducer,initState);

  function go(s){setMission(null);setScreen(s);}
  const isMain=MAIN.includes(screen);

  function renderScreen(){
    if(screen==='splash')return<Splash go={go}/>;
    if(screen==='hero')return<Hero go={go}/>;
    if(screen==='ghost')return<Ghost go={go}/>;
    if(screen==='charCreate')return<CharCreate go={go} dispatch={dispatch}/>;
    if(screen==='reveal')return<Reveal go={go}/>;
    if(screen==='home')return<Home gs={gs} dispatch={dispatch} go={go}/>;
    if(screen==='battle')return<BattleRunner gs={gs} dispatch={dispatch} onClose={()=>go('home')}/>;
    if(screen==='missions'){
      if(mission)return<MissionPlayer mission={mission} gs={gs} dispatch={dispatch} onDone={()=>setMission(null)}/>;
      return<MissionsList gs={gs} dispatch={dispatch} onMission={setMission}/>;
    }
    if(screen==='simulator')return<Simulator/>;
    if(screen==='scenarios')return<Scenarios gs={gs} dispatch={dispatch}/>;
    if(screen==='feed')return<Feed gs={gs}/>;
    if(screen==='vault')return<Vault gs={gs} dispatch={dispatch}/>;
  }

  return(
    <div style={{minHeight:'100vh',background:'#080818',display:'flex',justifyContent:'center',alignItems:'center',padding:20}}>
      <style>{`*{-webkit-tap-highlight-color:transparent}button{transition:opacity 0.15s}button:active{opacity:0.7}`}</style>
      <div style={{width:390,height:844,background:C.bg,borderRadius:44,overflow:'hidden',position:'relative',boxShadow:'0 0 0 2px #2a2a3a,0 0 80px rgba(232,112,18,0.2),0 40px 100px rgba(0,0,0,0.6)'}}>
        <div style={{position:'absolute',inset:0,overflow:'hidden'}}>
          {renderScreen()}
          {isMain&&<StatBar gs={gs}/>}
          {gs.pendingEvent&&isMain&&<EventModal event={gs.pendingEvent} dispatch={dispatch} gs={gs}/>}
          {gs.pendingLevelUp&&<LevelUpModal level={gs.pendingLevelUp} dispatch={dispatch}/>}
          {isMain&&<FedgeChat gs={gs}/>}
        </div>
        {isMain&&<BottomNav active={screen} go={go}/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
